[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-generator"
version = "0.1.0"
description = "CLI that finds untested functions in a Python module and generates pytest tests for them, using Claude when available and a template-based fallback otherwise."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Felipe Feres" }]
dependencies = [
    "coverage>=7.6",
    "pytest>=8.3",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]

[project.scripts]
ai-test-generator = "ai_test_generator.cli:main"

[tool.setuptools.packages.find]
include = ["ai_test_generator*"]
